spring:
  application:
    name: flowtwin
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/flowtwin}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

flowtwin:
  simulator:
    enabled: true            # set false to disable the built-in demo event generator
  llm:
    provider: ${LLM_PROVIDER:openai}
    api-key: ${LLM_API_KEY:}                       # REQUIRED for AI narration
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    model: ${LLM_MODEL:gpt-4o-mini}

logging:
  level:
    com.flowtwin: INFO
