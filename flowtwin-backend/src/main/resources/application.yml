spring:
  application:
    name: flowtwin
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/flowtwin}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

flowtwin:
  simulator:
    enabled: true            # set false to disable the built-in demo event generator
  ai:
    provider: ${FLOWTWIN_AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}                                            # keep this in the environment, never in source/git
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout-ms: ${GEMINI_TIMEOUT_MS:20000}

logging:
  level:
    com.flowtwin: INFO
