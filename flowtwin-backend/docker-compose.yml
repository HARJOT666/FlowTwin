services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flowtwin
      POSTGRES_USER: flowtwin
      POSTGRES_PASSWORD: flowtwin
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    depends_on:
      - postgres
      - redis
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/flowtwin
      REDIS_HOST: redis
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
